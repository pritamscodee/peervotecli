name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  COMPACT_VERSION: "0.31.1"

# A newer push to the same branch supersedes the older run (each e2e run boots a full devnet).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test:
    name: Compile contract + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact compiler (pinned ${{ env.COMPACT_VERSION }})
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.compact/bin:$PATH"
          compact update ${{ env.COMPACT_VERSION }}
          compact --version
          compact compile --version

      - name: Compile the private-election contract
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          npm run compile

      - name: Committed contract artifacts are up to date
        run: |
          git diff --exit-code contracts/managed/ \
            && echo "✅ committed managed/ artifacts match this compiler" \
            || { echo "❌ contracts/managed/ is stale — commit the freshly compiled output (the Midnight challenge requires it in the repo)."; exit 1; }

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e-devnet:
    name: End-to-end on local devnet
    runs-on: ubuntu-latest
    needs: compile-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact compiler (pinned ${{ env.COMPACT_VERSION }})
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.compact/bin:$PATH"
          compact update ${{ env.COMPACT_VERSION }}
          compact --version

      - name: Compile the private-election contract
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          npm run compile

      - name: Start local Midnight devnet (node + indexer + proof server)
        run: docker compose up -d --wait

      - name: Deploy election to the devnet
        run: npm run deploy

      - name: Read-only e2e check (ledger invariants)
        run: npm run test:e2e

      - name: Full election demo (5 votes, double-vote rejection, close)
        run: npm run election:demo

      - name: Teardown devnet
        if: always()
        run: docker compose down -v